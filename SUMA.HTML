<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>
<!-- Una sumita de dos valores.-->

<p id="resultado"></p>

    <script>


        function Sumar(num1, num2) {
            let suma = num1 + num2;
            return suma;
        }

        let numero1 = 5;
        let numero2 = 10;


        document.write (Sumar(numero1, numero2));
    </script>

<!-- Una sumita de TRES valores.para que me sirva en un mismo body hacemos dos script y le cambiamos el valor al let con otra letra mismo porque si se repite no sirve-->


    <script>


        function Sumar(num1, num2, num3) {
            let suma = num1 + num2 + num3;
            return suma;
        }

        let numeroo1 = 5;
        let numeroo2 = 10;
        let numeroo3 = 15;


        document.write (Sumar(numeroo1, numeroo2, numeroo3));
    </script>

</body>


</html>
