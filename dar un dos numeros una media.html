<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
            function CalcularMedia(num1, num2) {
                let suma = num1 + num2;
                let media = suma /2;
                return media;
            }

            let numero1 = 5;
            let numero2 = 10;
            let resultado = CalcularMedia(numero1, numero2);


            document.write(resultado);
    </script>

</body>

</html>
